<title>Preguntas a don Gorgonio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Una máscara por pantalla, como una ficha de museo en el celular: el nombre arriba, la foto y las
   tres preguntas; barra fija abajo con botones grandes */
:root {
  --papel: #f6eedd;
  --papel-2: #ecdfc4;
  --tinta: #1c1612;
  --tinta-suave: #54473d;
  --bermellon: #b9321c;
  --bermellon-oscuro: #8f2414;
  --turquesa: #146f6e;
  --borde: rgba(28, 22, 18, 0.2);
  --borde-control: #857463;
  --sobre-acento: #fffaf0;
  --whatsapp: #1b7d3d;
  --franjas: repeating-linear-gradient(90deg, #b9321c 0 28px, #e8a01a 28px 44px, #1c1612 44px 52px, #17807f 52px 76px, #fffaf0 76px 82px, #3b7a36 82px 100px);
  --titulos: "Fraunces", Georgia, "Times New Roman", serif;
  --texto: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #1a1512; --papel-2: #2a221c; --tinta: #f6eedd; --tinta-suave: #d3c5b1;
    --bermellon: #e0624a; --bermellon-oscuro: #f08a74; --turquesa: #4fb7b5;
    --borde: rgba(246, 238, 221, 0.22); --borde-control: #8d7f70; --sobre-acento: #1a1512; --whatsapp: #3fbf6a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #1a1512; --papel-2: #2a221c; --tinta: #f6eedd; --tinta-suave: #d3c5b1;
  --bermellon: #e0624a; --bermellon-oscuro: #f08a74; --turquesa: #4fb7b5;
  --borde: rgba(246, 238, 221, 0.22); --borde-control: #8d7f70; --sobre-acento: #1a1512; --whatsapp: #3fbf6a; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 6rem; scroll-padding-bottom: 7rem; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--texto); font-size: 1.2rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papel); }
.envoltura { max-width: 34rem; margin-inline: auto; }
h1, h2 { font-family: var(--titulos); font-weight: 650; text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--turquesa); outline-offset: 3px; }
::placeholder { color: var(--tinta-suave); opacity: 1; }
.solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.franjas { height: 8px; background: var(--franjas); border-radius: 0 0 4px 4px; }

/* Barra de arriba */
.barra {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--papel); padding-block: 0.55rem; border-bottom: 1px solid var(--borde);
  display: flex; align-items: center; gap: 0.75rem;
}
.progreso { flex: 1; min-width: 0; display: grid; gap: 0.3rem; }
.progreso-texto { font-weight: 700; font-size: 1.05rem; }
.progreso-barra { height: 10px; border-radius: 99px; background: var(--papel-2); overflow: hidden; }
.progreso-barra i { display: block; height: 100%; background: var(--bermellon); border-radius: 99px; }

/* Botones */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  min-height: 3.25rem; padding: 0.55rem 1.1rem; border-radius: 999px;
  border: 2px solid var(--tinta); background: transparent; color: var(--tinta);
  font-weight: 700; font-size: 1.15rem; text-decoration: none; cursor: pointer; text-align: center;
}
.boton.principal { background: var(--bermellon); border-color: var(--bermellon); color: var(--sobre-acento); }
.boton.whatsapp { background: var(--whatsapp); border-color: var(--whatsapp); color: var(--sobre-acento); }
.boton.whatsapp.ancho { width: 100%; }
.boton.whatsapp.mandada { background: transparent; color: var(--whatsapp); }
.boton.chico { min-height: 2.75rem; font-size: 1rem; padding: 0.35rem 0.9rem; }

/* Pantallas */
.pantalla { display: grid; gap: 1.1rem; padding-block: 1rem 7rem; }
.inicio { padding-block: 1.6rem 3rem; gap: 1.2rem; }
.inicio .saludo { font-family: var(--titulos); font-size: 1.35rem; }
.pasos { margin: 0; padding-left: 1.6rem; display: grid; gap: 0.3rem; }
.pasos li::marker { color: var(--bermellon); font-weight: 700; }
.nota { color: var(--tinta-suave); }
.acciones { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.aviso { padding: 0.9rem 1rem; border-radius: 12px; border: 2px solid var(--bermellon); }

.ficha { display: grid; gap: 0.3rem; }
.sala { font-size: 1rem; font-weight: 700; color: var(--bermellon-oscuro); }
.llamamos { color: var(--tinta-suave); font-size: 1.05rem; }
.ficha h1 { font-size: 1.7rem; }

.foto { margin: 0; background: var(--papel-2); border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
.foto img { width: 100%; height: clamp(10rem, 30vh, 24rem); height: clamp(10rem, 30svh, 24rem); object-fit: contain; }
.vistas { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.vistas span { color: var(--tinta-suave); font-size: 1rem; }
.vistas button { padding: 0; width: 3.5rem; height: 3.5rem; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: var(--papel-2); cursor: pointer; }
.vistas button[aria-pressed="true"] { border-color: var(--bermellon); }
.vistas img { width: 100%; height: 100%; object-fit: cover; }

.pregunta { display: grid; gap: 0.7rem; padding: 1rem; border-radius: 14px; background: var(--papel-2); }
.ayuda { color: var(--tinta-suave); font-size: 1.05rem; }
.opciones { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.opcion {
  min-height: 3.25rem; padding: 0.5rem 1rem 0.5rem 0.7rem; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--borde-control); background: var(--papel); font-weight: 600; font-size: 1.1rem; text-align: left;
}
/* la ✓ siempre ocupa su lugar, para que los botones no brinquen al elegir */
.opcion::before, .sugerencias button::before { content: "✓"; content: "✓" / ""; display: inline-block; width: 1.1em; visibility: hidden; }
.opcion[aria-pressed="true"], .sugerencias button[aria-pressed="true"] { border-color: var(--bermellon); background: var(--bermellon); color: var(--sobre-acento); }
.opcion[aria-pressed="true"]::before, .sugerencias button[aria-pressed="true"]::before { visibility: visible; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.sugerencias button { min-height: 3rem; padding: 0.3rem 0.85rem 0.3rem 0.55rem; border-radius: 999px; border: 2px solid var(--borde-control); background: var(--papel); cursor: pointer; font-size: 1.1rem; }
label { font-weight: 700; }
input[type="text"], textarea {
  width: 100%; padding: 0.7rem 0.85rem; border-radius: 12px;
  border: 2px solid var(--borde-control); background: var(--papel); font-size: 1.15rem;
}
input.corto { max-width: 10rem; }
textarea { min-height: 6.5rem; resize: vertical; }
.foto-pregunta { width: 100%; border-radius: 12px; }

.pregunta-otra, #uso-otro-caja { display: grid; gap: 0.6rem; }
.pasos-audio { font-size: 1.05rem; color: var(--tinta-suave); }
.cierre-mascara { display: grid; gap: 0.6rem; padding-top: 0.4rem; border-top: 1px solid var(--borde); }

/* Barra de abajo */
.navegacion {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--papel); border-top: 1px solid var(--borde);
  padding-top: 0.7rem;
  padding-bottom: max(0.7rem, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: transform 0.2s ease;
}
.navegacion .envoltura { display: grid; grid-template-columns: 1fr 1.4fr; gap: 0.75rem; }
.navegacion .boton { white-space: nowrap; padding-inline: 0.6rem; }
/* mientras escribe en el celular, la barra de abajo se quita para no tapar lo que escribe */
@media (pointer: coarse) { .escribiendo .navegacion { transform: translateY(110%); } }
/* pantallas bajas (teléfono acostado, mucho zoom): las barras dejan de flotar */
@media (max-height: 34rem) {
  .barra, .navegacion { position: static; }
  .pantalla { padding-bottom: 1.5rem; }
}

/* Todas */
.rejilla { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: 0.6rem; }
.rejilla button { position: relative; width: 100%; padding: 0; border: 3px solid transparent; border-radius: 12px; overflow: hidden; background: var(--papel-2); cursor: pointer; aspect-ratio: 3 / 4; max-width: 100%; }
.rejilla img { width: 100%; height: 100%; object-fit: cover; }
.rejilla .num { position: absolute; left: 0.3rem; top: 0.3rem; background: var(--papel); color: var(--tinta); border-radius: 8px; padding: 0 0.4rem; font-weight: 700; font-size: 0.95rem; }
.rejilla .listo { position: absolute; right: 0.3rem; bottom: 0.3rem; background: var(--turquesa); color: var(--sobre-acento); border-radius: 99px; padding: 0 0.5rem; font-weight: 700; font-size: 0.9rem; }
.rejilla button.contestada { border-color: var(--turquesa); }
.rejilla button.aqui { outline: 3px solid var(--bermellon); outline-offset: 2px; }

.resumen { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--papel-2); border-radius: 14px; padding: 1rem; font-family: var(--texto); font-size: 1rem; margin: 0; }
.partes { display: grid; gap: 0.6rem; }

@media (prefers-reduced-motion: reduce) { .navegacion { transition: none; } }
@media (prefers-reduced-motion: no-preference) {
  .boton, .opcion, .vistas button, .sugerencias button { transition: background-color 0.15s ease, border-color 0.15s ease; }
}
</style>

<div class="envoltura"><div class="franjas" aria-hidden="true"></div></div>
<div id="app" class="envoltura">
  <main class="pantalla inicio">
    <h1 tabindex="-1">Don Gorgonio: cuéntenos de sus máscaras</h1>
    <p class="saludo">Estamos haciendo la página de internet de su trabajo y queremos ponerle bien el nombre a cada máscara.</p>
    <p>Le vamos a enseñar sus máscaras una por una. De cada una le preguntamos tres cosas:</p>
    <ol class="pasos">
      <li>Qué es</li>
      <li>En qué danza o fiesta se usa</li>
      <li>Qué significa</li>
    </ol>
    <div class="acciones"><button class="boton principal" type="button" data-ir="1">Empezar</button></div>
  </main>
</div>
<nav class="navegacion" id="navegacion" hidden aria-label="Avanzar o regresar">
  <div class="envoltura">
    <button class="boton" type="button" id="atras">← Anterior</button>
    <button class="boton principal" type="button" id="adelante">Siguiente →</button>
  </div>
</nav>
<p class="solo-lector" id="anuncio" role="status"></p>

<script>
(function () {
  "use strict";
  document.documentElement.lang = "es";
  var D = /*DATOS*/null;
  var M = D.mascaras, G = D.generales, TOTAL = M.length;
  var DESTINO = String(D.destino || "").replace(/\D/g, "");
  var A_QUIEN = D.destino_nombre || "";
  var CLAVE = "encuesta-gorgonio-v1";
  var NOMBRES = ["Coyote", "Perro", "Chivo", "Borrego", "Tecolote", "Lince", "Ocelote", "Tigre", "Jaguar", "Burro", "Guacamaya", "Gallo", "Venado", "Toro", "Nahual", "Diablo", "La Muerte"];
  var OTRA = "Otra danza o fiesta", NO_SE = "No sé", ADORNO = "No se baila, es de adorno";
  var USOS = ["Danza de los Morenos", "Pastorela", OTRA, ADORNO, NO_SE];
  var app = document.getElementById("app");
  var nav = document.getElementById("navegacion");
  var atras = document.getElementById("atras");
  var adelante = document.getElementById("adelante");
  var porId = {};
  M.forEach(function (m) { porId[m.id] = m; });

  // ---------- Estado, siempre normalizado ----------
  function txt(v) { return typeof v === "string" ? v : v == null ? "" : String(v); }
  function obj(o) { return o && typeof o === "object" && !Array.isArray(o) ? o : {}; }
  function limpiaR(x) {
    x = obj(x);
    return { es: txt(x.es), suya: txt(x.suya), que_es: txt(x.que_es),
      uso: Array.isArray(x.uso) ? x.uso.filter(function (u) { return typeof u === "string"; }) : [],
      uso_otro: txt(x.uso_otro), significado: txt(x.significado), act: txt(x.act) };
  }
  function limpiaG(g) {
    var o = {};
    Object.keys(obj(g)).forEach(function (k) { var v = obj(g[k]); o[k] = { opcion: txt(v.opcion), texto: txt(v.texto) }; });
    return o;
  }
  var estado = { r: {}, g: {}, gAct: "", pos: "inicio", ultima: 0, enviadas: {}, mandado: {} };
  var hayAlmacen = false;
  try { localStorage.setItem(CLAVE + "-p", "1"); localStorage.removeItem(CLAVE + "-p"); hayAlmacen = true; } catch (e) {}
  try {
    var g0 = obj(JSON.parse(localStorage.getItem(CLAVE) || "null"));
    Object.keys(obj(g0.r)).forEach(function (k) { if (porId[k]) estado.r[k] = limpiaR(g0.r[k]); });
    estado.g = limpiaG(g0.g);
    estado.gAct = txt(g0.gAct);
    var p0 = txt(g0.pos);
    estado.pos = /^(\d+|todas|usted|enviar|inicio)$/.test(p0) ? p0 : "inicio";
    estado.ultima = Math.min(Math.max(parseInt(g0.ultima, 10) || 0, 0), TOTAL);
    estado.enviadas = obj(g0.enviadas);
    estado.mandado = obj(g0.mandado);
  } catch (e) {}

  function guardarLocal() {
    if (!hayAlmacen) return;
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); }
    catch (e) { hayAlmacen = false; anunciar("Este teléfono ya no puede guardar sus respuestas. Mándelas por WhatsApp antes de cerrar."); }
  }
  function anunciar(t) { document.getElementById("anuncio").textContent = t; }

  function respuesta(id) {
    if (!estado.r[id]) estado.r[id] = limpiaR({});
    return estado.r[id];
  }
  function tocada(id) { var r = respuesta(id); r.act = new Date().toISOString(); return r; }
  function contestada(id) {
    var r = estado.r[id];
    return !!(r && (r.es || r.suya || r.que_es.trim() || r.uso.length || r.significado.trim() ||
      (r.uso.indexOf(OTRA) >= 0 && r.uso_otro.trim())));
  }
  function cuantas() { return M.filter(function (m) { return contestada(m.id); }).length; }
  function textoGeneral(q) { var v = estado.g[q.id]; return v ? [v.opcion, v.texto.trim()].filter(Boolean).join(". ") : ""; }
  function generalesContestadas() { return G.filter(function (q) { return textoGeneral(q); }).length; }

  function dondeSeGuarda() {
    if (modo === "db") return "Lo que contesta se guarda en línea.";
    if (hayAlmacen) return "Lo que contesta se queda guardado en este teléfono, pero no nos llega solo: mándelo con el botón verde.";
    return "Este teléfono no puede guardar lo que conteste. Mándelo por WhatsApp antes de cerrar la página.";
  }

  // ---------- Guardar en línea: solo si quien abre la página puede escribir ----------
  var db = null, modo = "local", quitar = [];
  var pendientes = {}, tiempos = {}, escribiendo = {}, esperando = {}, reintentos = {};
  var TERMINALES = ["invalid_argument", "transform_error", "revoked", "not_granted", "capability_disabled", "capability_removed"];

  function pasarALocal() {
    db = null; modo = "local";
    quitar.forEach(function (f) { try { f(); } catch (e) {} });
    quitar = [];
    anunciar("Sus respuestas se guardan en este teléfono.");
  }
  function programar(ruta, datos) {
    if (!db) return;
    pendientes[ruta] = datos;
    clearTimeout(tiempos[ruta]);
    tiempos[ruta] = setTimeout(function () { escribir(ruta); }, 800);
  }
  function escribir(ruta) {
    if (!db || escribiendo[ruta] || esperando[ruta] || !pendientes[ruta]) return;
    var datos = pendientes[ruta];
    delete pendientes[ruta];
    escribiendo[ruta] = true;
    db.doc(ruta).set(datos).then(function () {
      reintentos[ruta] = 0;
    }, function (e) {
      var code = e && e.code;
      if (code === "quota_exceeded") {
        anunciar("No se pudo guardar en línea: ya no hay espacio. Queda guardado en este teléfono.");
      } else if (TERMINALES.indexOf(code) >= 0) {
        pasarALocal();
      } else {
        reintentos[ruta] = (reintentos[ruta] || 0) + 1;
        if (!pendientes[ruta]) pendientes[ruta] = datos;
        esperando[ruta] = true;
        setTimeout(function () { esperando[ruta] = false; escribir(ruta); },
          Math.min(30000, 1500 * Math.pow(2, reintentos[ruta] - 1)) + Math.random() * 1000);
      }
    }).then(function () {
      escribiendo[ruta] = false;
      if (pendientes[ruta]) escribir(ruta);
    });
  }
  function subirMascara(id) {
    var m = porId[id];
    programar("respuestas/" + id, Object.assign({}, estado.r[id], { n: m.n, nombre: m.nombre }));
  }
  function subirGenerales() {
    programar("generales/sobre-usted", { respuestas: estado.g, act: estado.gAct });
  }
  function editando() {
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"));
  }

  function conectar() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (res) {
      var base = res[0], usuario = res[1];
      if (!base || !usuario) return;
      return usuario.can("data.write").catch(function () { return null; }).then(function (si) {
        if (si !== true) return;
        db = base; modo = "db";
        anunciar("Sus respuestas se guardan en línea.");
        var migrado = false;
        quitar.push(db.collection("respuestas").onSnapshot(function (snap) {
          var enLinea = {}, cambio = false;
          snap.docs.forEach(function (d) {
            if (!porId[d.id]) return;
            enLinea[d.id] = true;
            if (pendientes["respuestas/" + d.id] || escribiendo["respuestas/" + d.id] || esperando["respuestas/" + d.id]) return;
            var remota = limpiaR(d.data()), local = estado.r[d.id];
            if (local && contestada(d.id) && local.act > remota.act) { subirMascara(d.id); return; } // lo de aquí es más nuevo
            if (JSON.stringify(local) !== JSON.stringify(remota)) { estado.r[d.id] = remota; cambio = true; }
          });
          var definitiva = !(snap.metadata && snap.metadata.fromCache);
          if (!migrado && definitiva) {
            migrado = true;
            // lo contestado en este teléfono antes de entrar se sube, de a poco
            Object.keys(estado.r).filter(function (id) { return !enLinea[id] && contestada(id); })
              .forEach(function (id, k) { setTimeout(function () { subirMascara(id); }, 400 * k); });
          }
          if (cambio) { guardarLocal(); if (!editando()) render(false); }
        }, function () { pasarALocal(); }));
        quitar.push(db.doc("generales/sobre-usted").onSnapshot(function (d) {
          var r = "generales/sobre-usted";
          if (pendientes[r] || escribiendo[r] || esperando[r]) return;
          var definitiva = !(d.metadata && d.metadata.fromCache);
          var x = d.exists ? obj(d.data()) : null;
          if (x && txt(x.act) >= estado.gAct) {
            var nuevo = limpiaG(x.respuestas);
            if (JSON.stringify(nuevo) !== JSON.stringify(estado.g)) {
              estado.g = nuevo; estado.gAct = txt(x.act); guardarLocal();
              if (!editando()) render(false);
            }
          } else if (definitiva && generalesContestadas()) {
            subirGenerales();
          }
        }, function () {}));
      });
    }).catch(function () {});
  }

  // ---------- WhatsApp ----------
  function wa(texto) { return "https://wa.me/" + DESTINO + "?text=" + encodeURIComponent(texto); }
  function bloques() {
    var lista = [];
    M.forEach(function (m) {
      if (!contestada(m.id)) return;
      var r = estado.r[m.id], l = [m.n + ". " + m.nombre];
      if (r.suya) l.push("¿La hizo usted?: " + ({ si: "sí", no: "no, otra persona", nose: "no sabe" })[r.suya]);
      if (r.es === "si") l.push("Es: sí, está bien el nombre");
      else if (r.es === "otra") l.push("Es: " + (r.que_es.trim() || "otra cosa (sin decir qué)"));
      else if (r.es === "nose") l.push("Es: no sabe");
      else if (r.es) l.push("Es: " + r.es);
      else if (r.que_es.trim()) l.push("Es: " + r.que_es.trim());
      var usos = r.uso.map(function (u) { return u === OTRA && r.uso_otro.trim() ? r.uso_otro.trim() : u; });
      if (usos.length) l.push("Se usa en: " + usos.join(", "));
      if (r.significado.trim()) l.push("Significa: " + r.significado.trim());
      lista.push({ id: m.id, texto: l.join("\n") });
    });
    G.forEach(function (q, k) {
      var t = textoGeneral(q);
      if (t) lista.push({ id: "g:" + q.id, texto: "Sobre usted, pregunta " + (k + 1) + ". " + q.texto + "\n" + t });
    });
    return lista;
  }
  // Partes de un tamaño seguro para un enlace de WhatsApp, medido ya codificado
  function partes(lista) {
    var LIM = 2800, largo = function (x) { return encodeURIComponent(x).length; };
    var piezas = [];
    lista.forEach(function (b) {
      if (largo(b.texto) <= LIM) { piezas.push(b); return; }
      var trozo = "";
      b.texto.split(/(\s+)/).forEach(function (w) {
        if (trozo.trim() && largo(trozo + w) > LIM - 60) { piezas.push({ id: b.id, texto: trozo.trim() + " (sigue…)", parcial: true }); trozo = ""; }
        trozo += w;
      });
      if (trozo.trim()) piezas.push({ id: b.id, texto: trozo.trim(), fin: b.texto });
    });
    var res = [], actual = null;
    piezas.forEach(function (b) {
      if (actual && largo(actual.texto + "\n\n" + b.texto) > LIM) { res.push(actual); actual = null; }
      if (!actual) actual = { texto: "", bloques: [] };
      actual.texto += (actual.texto ? "\n\n" : "") + b.texto;
      actual.bloques.push(b);
    });
    if (actual) res.push(actual);
    return res.map(function (p, k) {
      p.texto = "Respuestas de don Gorgonio sobre sus máscaras" + (res.length > 1 ? " (parte " + (k + 1) + " de " + res.length + ")" : "") + "\n\n" + p.texto;
      p.clave = p.texto.length + ":" + p.texto.slice(-40);
      return p;
    });
  }

  function marcarGrupo(b, valor) {
    b.parentNode.querySelectorAll(".opcion").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.valor === valor)); });
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button, a");
    if (!b || !app.contains(b)) return;
    if (b.dataset.ir) { ir(b.dataset.ir); return; }
    var n = Number(estado.pos), m = M[n - 1];
    if (b.dataset.vista != null && m) {
      document.getElementById("foto").src = m.fotos[Number(b.dataset.vista)];
      app.querySelectorAll("[data-vista]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      return;
    }
    if (b.dataset.sugerencia && m) {
      var r0 = tocada(m.id), campo = document.getElementById("que-es");
      r0.que_es = r0.que_es === b.dataset.sugerencia ? "" : b.dataset.sugerencia;
      campo.value = r0.que_es;
      app.querySelectorAll("[data-sugerencia]").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.sugerencia === r0.que_es)); });
      guardarLocal(); subirMascara(m.id);
      return;
    }
    if (!b.dataset.campo) return;
    var c = b.dataset.campo, v = b.dataset.valor;
    if (c.indexOf("g:") === 0) {
      var id = c.slice(2), g = estado.g[id] = Object.assign({ opcion: "", texto: "" }, estado.g[id]);
      g.opcion = g.opcion === v ? "" : v;
      estado.gAct = new Date().toISOString();
      marcarGrupo(b, g.opcion);
      guardarLocal(); subirGenerales();
      return;
    }
    if (!m) return;
    var r = tocada(m.id);
    if (b.dataset.multiple) {
      var i = r.uso.indexOf(v);
      if (i >= 0) {
        r.uso.splice(i, 1);
        if (v === OTRA) { r.uso_otro = ""; document.getElementById("uso-otro").value = ""; }
      } else if (v === NO_SE || v === ADORNO) {
        r.uso = [v]; r.uso_otro = ""; document.getElementById("uso-otro").value = "";
      } else {
        r.uso = r.uso.filter(function (u) { return u !== NO_SE && u !== ADORNO; });

      b.parentNode.querySelectorAll(".opcion").forEach(function (o) { o.setAttribute("aria-pressed", String(r.uso.indexOf(o.dataset.valor) >= 0)); });
      document.getElementById("uso-otro-caja").hidden = r.uso.indexOf(OTRA) < 0;
    } else {
      r[c] = r[c] === v ? "" : v;
      marcarGrupo(b, r[c]);
      if (c === "es") document.getElementById("otra").hidden = r.es !== "otra";
    }
    guardarLocal(); subirMascara(m.id);
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.general) {
      var g = estado.g[t.dataset.general] = Object.assign({ opcion: "", texto: "" }, estado.g[t.dataset.general]);
      g.texto = t.value;
      estado.gAct = new Date().toISOString();
      guardarLocal(); subirGenerales();
      return;
    }
    if (t.dataset.texto) {
      var m = M[Number(estado.pos) - 1];
      if (!m) return;
      var r = tocada(m.id);
      r[t.dataset.texto] = t.value;
      if (t.dataset.texto === "que_es") app.querySelectorAll("[data-sugerencia]").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.sugerencia === t.value)); });
      guardarLocal(); subirMascara(m.id);
    }
  });
  atras.addEventListener("click", function () {
    var p = estado.pos, n = Number(p);
    if (p === "usted") ir(TOTAL); else if (n > 1) ir(n - 1); else ir("inicio");
  });
  adelante.addEventListener("click", function () {
    var p = estado.pos, n = Number(p);
    if (p === "usted") ir("enviar"); else if (n >= TOTAL) ir("usted"); else ir(n + 1);
  });
  document.addEventListener("focusin", function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) document.body.classList.add("escribiendo");
  });
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (!editando()) document.body.classList.remove("escribiendo"); }, 0);
  });
  window.addEventListener("popstate", function (e) {
    var p = e.state && e.state.pos;
    if (!p) return;
    ir(p, true);
  });

  try { history.replaceState({ pos: estado.pos }, ""); } catch (e) {}
  render(false);
  conectar();
})();
</script>
