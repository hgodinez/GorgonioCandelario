<title>Preguntas a don Gorgonio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Una máscara por pantalla, como una ficha de museo en el celular: el nombre arriba, la foto y las
   tres preguntas; barra fija abajo con botones grandes */
:root {
  --papel: #f6eedd;
  --papel-2: #ecdfc4;
  --tinta: #1c1612;
  --tinta-suave: #54473d;
  --bermellon: #b9321c;
  --bermellon-oscuro: #8f2414;
  --turquesa: #146f6e;
  --borde: rgba(28, 22, 18, 0.2);
  --borde-control: #857463;
  --sobre-acento: #fffaf0;
  --hecho: #176b34;
  --franjas: repeating-linear-gradient(90deg, #b9321c 0 28px, #e8a01a 28px 44px, #1c1612 44px 52px, #17807f 52px 76px, #fffaf0 76px 82px, #3b7a36 82px 100px);
  --titulos: "Fraunces", Georgia, "Times New Roman", serif;
  --texto: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #1a1512; --papel-2: #2a221c; --tinta: #f6eedd; --tinta-suave: #d3c5b1;
    --bermellon: #e0624a; --bermellon-oscuro: #f08a74; --turquesa: #4fb7b5;
    --borde: rgba(246, 238, 221, 0.22); --borde-control: #8d7f70; --sobre-acento: #1a1512; --hecho: #3fbf6a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #1a1512; --papel-2: #2a221c; --tinta: #f6eedd; --tinta-suave: #d3c5b1;
  --bermellon: #e0624a; --bermellon-oscuro: #f08a74; --turquesa: #4fb7b5;
  --borde: rgba(246, 238, 221, 0.22); --borde-control: #8d7f70; --sobre-acento: #1a1512; --hecho: #3fbf6a; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 6rem; scroll-padding-bottom: 7rem; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--texto); font-size: 1.2rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papel); }
.envoltura { max-width: 34rem; margin-inline: auto; }
h1, h2 { font-family: var(--titulos); font-weight: 650; text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--turquesa); outline-offset: 3px; }
::placeholder { color: var(--tinta-suave); opacity: 1; }
.solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.franjas { height: 8px; background: var(--franjas); border-radius: 0 0 4px 4px; }

/* Barra de arriba */
.barra {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--papel); padding-block: 0.55rem; border-bottom: 1px solid var(--borde);
  display: flex; align-items: center; gap: 0.75rem;
}
.progreso { flex: 1; min-width: 0; display: grid; gap: 0.3rem; }
.progreso-texto { font-weight: 700; font-size: 1.05rem; }
.progreso-barra { height: 10px; border-radius: 99px; background: var(--papel-2); overflow: hidden; }
.progreso-barra i { display: block; height: 100%; background: var(--tinta-suave); border-radius: 99px; }

/* Botones */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  min-height: 3.25rem; padding: 0.55rem 1.1rem; border-radius: 999px;
  border: 2px solid var(--tinta); background: transparent; color: var(--tinta);
  font-weight: 700; font-size: 1.15rem; text-decoration: none; cursor: pointer; text-align: center;
}
.boton.principal { background: var(--bermellon); border-color: var(--bermellon); color: var(--sobre-acento); }
.boton.ancho { width: 100%; }
.boton.mandada { background: transparent; border-color: var(--hecho); color: var(--hecho); }
.boton.chico { min-height: 2.75rem; font-size: 1rem; padding: 0.35rem 0.9rem; }

/* Pantallas */
.pantalla { display: grid; gap: 1.1rem; padding-block: 1rem 7rem; }
.inicio { padding-block: 1.6rem 3rem; gap: 1.2rem; }
.inicio .saludo { font-family: var(--titulos); font-size: 1.35rem; }
.pasos { margin: 0; padding-left: 1.6rem; display: grid; gap: 0.3rem; }
.pasos li::marker { color: var(--tinta-suave); font-weight: 700; }
.nota { color: var(--tinta-suave); }
.acciones { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.aviso { padding: 0.9rem 1rem; border-radius: 12px; border: 2px solid var(--borde-control); }

.ficha { display: grid; gap: 0.3rem; }
.sala { font-size: 1rem; font-weight: 700; color: var(--tinta-suave); }
.ficha h1 { font-size: 1.7rem; }

.foto { margin: 0; background: var(--papel-2); border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
.foto img { width: 100%; height: clamp(10rem, 30vh, 24rem); height: clamp(10rem, 30svh, 24rem); object-fit: contain; }
.vistas { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.vistas span { color: var(--tinta-suave); font-size: 1rem; }
.vistas button { padding: 0; width: 3.5rem; height: 3.5rem; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: var(--papel-2); cursor: pointer; }
.vistas button[aria-pressed="true"] { border-color: var(--tinta); }
.vistas img { width: 100%; height: 100%; object-fit: cover; }

.pregunta { display: grid; gap: 0.7rem; padding: 1rem; border-radius: 14px; background: var(--papel-2); }
.ayuda { color: var(--tinta-suave); font-size: 1.05rem; }
.opciones { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.opcion {
  min-height: 3.25rem; padding: 0.5rem 1rem 0.5rem 0.7rem; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--borde-control); background: var(--papel); font-weight: 600; font-size: 1.1rem; text-align: left;
}
/* la ✓ siempre ocupa su lugar, para que los botones no brinquen al elegir */
.opcion::before, .sugerencias button::before { content: "✓"; content: "✓" / ""; display: inline-block; width: 1.1em; visibility: hidden; }
.opcion[aria-pressed="true"], .sugerencias button[aria-pressed="true"] { border-color: var(--hecho); background: var(--hecho); color: var(--sobre-acento); }
.opcion[aria-pressed="true"]::before, .sugerencias button[aria-pressed="true"]::before { visibility: visible; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.sugerencias button { min-height: 3rem; padding: 0.3rem 0.85rem 0.3rem 0.55rem; border-radius: 999px; border: 2px solid var(--borde-control); background: var(--papel); cursor: pointer; font-size: 1.1rem; }
label { font-weight: 700; }
input[type="text"], textarea {
  width: 100%; padding: 0.7rem 0.85rem; border-radius: 12px;
  border: 2px solid var(--borde-control); background: var(--papel); font-size: 1.15rem;
}
input.corto { max-width: 10rem; }
textarea { min-height: 6.5rem; resize: vertical; }
.foto-pregunta { width: 100%; border-radius: 12px; }

.pregunta-otra, #uso-otro-caja, #sexo-caja { display: grid; gap: 0.6rem; }
.subpregunta { font-weight: 700; }
.pasos-audio { font-size: 1.05rem; color: var(--tinta-suave); }
.grabadora { display: grid; gap: 0.6rem; }
.grabadora .boton.grabando { background: var(--bermellon); border-color: var(--bermellon); color: var(--sobre-acento); }
.nombre-pregunta { font-family: var(--titulos); font-weight: 650; font-size: 1.35rem; line-height: 1.2; text-wrap: balance; }
/* lo del audio va aparte y se ve como algo que no es obligatorio */
.pregunta.opcional { background: transparent; border: 2px dashed var(--borde-control); }
.opcional h2 { font-size: 1.15rem; }
.etiqueta-opcional { font-family: var(--texto); font-weight: 600; font-size: 0.95rem; color: var(--tinta-suave); }
.grabadora .boton svg { width: 1.2em; height: 1.2em; flex: none; }
.audios { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.audios li { display: grid; gap: 0.3rem; font-size: 1.05rem; color: var(--hecho); font-weight: 700; }
.audios audio { width: 100%; }
.estado-guardado { font-weight: 700; }
.cierre-mascara { display: grid; gap: 0.6rem; padding-top: 0.4rem; border-top: 1px solid var(--borde); }

/* Barra de abajo */
.navegacion {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--papel); border-top: 1px solid var(--borde);
  padding-top: 0.7rem;
  padding-bottom: max(0.7rem, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: transform 0.2s ease;
}
.navegacion .envoltura { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr); gap: 0.75rem; }
.navegacion .boton { white-space: normal; line-height: 1.15; padding-inline: 0.6rem; }
/* «Siguiente» es lo más visible de la pantalla; «Anterior» se queda discreto */
#adelante { min-height: 3.75rem; font-size: 1.3rem; }
#atras { border-color: var(--borde-control); font-weight: 600; }
/* mientras escribe en el celular, la barra de abajo se quita para no tapar lo que escribe */
@media (pointer: coarse) { .escribiendo .navegacion { transform: translateY(110%); } }
/* pantallas bajas (teléfono acostado, mucho zoom): las barras dejan de flotar */
@media (max-height: 34rem) {
  .barra, .navegacion { position: static; }
  .pantalla { padding-bottom: 1.5rem; }
}

/* Todas */
.rejilla { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: 0.6rem; }
.rejilla button { position: relative; width: 100%; padding: 0; border: 3px solid transparent; border-radius: 12px; overflow: hidden; background: var(--papel-2); cursor: pointer; aspect-ratio: 3 / 4; max-width: 100%; }
.rejilla img { width: 100%; height: 100%; object-fit: cover; }
.rejilla .num { position: absolute; left: 0.3rem; top: 0.3rem; background: var(--papel); color: var(--tinta); border-radius: 8px; padding: 0 0.4rem; font-weight: 700; font-size: 0.95rem; }
.rejilla .listo { position: absolute; right: 0.3rem; bottom: 0.3rem; background: var(--hecho); color: var(--sobre-acento); border-radius: 99px; padding: 0 0.5rem; font-weight: 700; font-size: 0.9rem; }
.rejilla button.contestada { border-color: var(--hecho); }
.rejilla button.aqui { outline: 3px solid var(--tinta); outline-offset: 2px; }

.resumen { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--papel-2); border-radius: 14px; padding: 1rem; font-family: var(--texto); font-size: 1rem; margin: 0; }
.partes { display: grid; gap: 0.6rem; }

@media (prefers-reduced-motion: reduce) { .navegacion { transition: none; } }
@media (prefers-reduced-motion: no-preference) {
  .boton, .opcion, .vistas button, .sugerencias button { transition: background-color 0.15s ease, border-color 0.15s ease; }
}
</style>

<div class="envoltura"><div class="franjas" aria-hidden="true"></div></div>
<div id="app" class="envoltura">
  <main class="pantalla inicio">
    <h1 tabindex="-1">Don Gorgonio: cuénteme de sus máscaras</h1>
    <p class="saludo">Estoy haciendo la página de internet de su trabajo y quiero ponerle bien el nombre a cada máscara.</p>
    <p>Le voy a enseñar sus máscaras una por una. De cada una le pregunto tres cosas:</p>
    <ol class="pasos">
      <li>Qué es</li>
      <li>En qué danza o fiesta se usa</li>
      <li>Qué significa</li>
    </ol>
    <div class="acciones"><button class="boton principal" type="button" data-ir="1">Empezar</button></div>
  </main>
</div>
<nav class="navegacion" id="navegacion" hidden aria-label="Avanzar o regresar">
  <div class="envoltura">
    <button class="boton" type="button" id="atras">← Anterior</button>
    <button class="boton principal" type="button" id="adelante">Siguiente →</button>
  </div>
</nav>
<p class="solo-lector" id="anuncio" role="status"></p>

<script>
(function () {
  "use strict";
  document.documentElement.lang = "es";
  var D = /*DATOS*/null;
  var M = D.mascaras, G = D.generales, TOTAL = M.length;
  var DESTINO = String(D.destino || "").replace(/\D/g, "");
  var A_QUIEN = D.destino_nombre || "";
  var SB = D.supabase && D.supabase.url && D.supabase.key ? D.supabase : null;
  var CLAVE = "encuesta-gorgonio-v1";
  var NOMBRES = ["Coyote", "Perro", "Chivo", "Borrego", "Tecolote", "Lince", "Ocelote", "Tigre", "Jaguar", "Burro", "Guacamaya", "Gallo", "Venado", "Toro", "Nahual", "Diablo", "La Muerte"];
  var OTRA = "Otra danza o fiesta", NO_SE = "No sé", ADORNO = "No se baila, es de adorno";
  var DANZA = "Danza de los Morenos", USOS = [DANZA, "Pastorela", OTRA, ADORNO, NO_SE];
  // en la Danza de los Morenos se baila en parejas de macho y hembra
  var SEXOS = { macho: "macho", hembra: "hembra", nose: "no sabe" };
  var app = document.getElementById("app");
  var nav = document.getElementById("navegacion");
  var atras = document.getElementById("atras");
  var adelante = document.getElementById("adelante");
  var porId = {};
  M.forEach(function (m) { porId[m.id] = m; });

  // ---------- Estado, siempre normalizado ----------
  function txt(v) { return typeof v === "string" ? v : v == null ? "" : String(v); }
  function obj(o) { return o && typeof o === "object" && !Array.isArray(o) ? o : {}; }
  function limpiaR(x) {
    x = obj(x);
    return { es: txt(x.es), suya: txt(x.suya), que_es: txt(x.que_es),
      uso: Array.isArray(x.uso) ? x.uso.filter(function (u) { return typeof u === "string"; }) : [],
      uso_otro: txt(x.uso_otro), sexo: SEXOS[x.sexo] ? x.sexo : "", significado: txt(x.significado), act: txt(x.act) };
  }
  function limpiaG(g) {
    var o = {};
    Object.keys(obj(g)).forEach(function (k) { var v = obj(g[k]); o[k] = { opcion: txt(v.opcion), texto: txt(v.texto) }; });
    return o;
  }
  var estado = { r: {}, g: {}, gAct: "", pos: "inicio", ultima: 0, enviadas: {}, mandado: {}, audios: {}, salida: {}, sbHecho: {}, rechazadas: {}, clave: "", dispositivo: "" };
  // …&reiniciar=1 en el enlace (para probar): olvida lo contestado en este teléfono; lo que ya llegó a la base se queda
  try {
    var q0 = new URLSearchParams(location.search);
    if (q0.get("reiniciar") === "1") {
      if (window.confirm("¿Borrar lo que se contestó en este teléfono y empezar de nuevo? Lo que ya llegó por internet no se borra.")) {
        try { localStorage.removeItem(CLAVE); } catch (e) {}
        try { indexedDB.deleteDatabase("encuesta-gorgonio-audios"); } catch (e) {}
      }
      q0.delete("reiniciar");
      history.replaceState(null, "", location.pathname + (q0.toString() ? "?" + q0.toString() : ""));
    }
  } catch (e) {}
  var hayAlmacen = false;
  try { localStorage.setItem(CLAVE + "-p", "1"); localStorage.removeItem(CLAVE + "-p"); hayAlmacen = true; } catch (e) {}
  try {
    var g0 = obj(JSON.parse(localStorage.getItem(CLAVE) || "null"));
    Object.keys(obj(g0.r)).forEach(function (k) { if (porId[k]) estado.r[k] = limpiaR(g0.r[k]); });
    estado.g = limpiaG(g0.g);
    estado.gAct = txt(g0.gAct);
    var p0 = txt(g0.pos);
    estado.pos = /^(\d+|todas|usted|enviar|inicio)$/.test(p0) ? p0 : "inicio";
    estado.ultima = Math.min(Math.max(parseInt(g0.ultima, 10) || 0, 0), TOTAL);
    estado.enviadas = obj(g0.enviadas);
    estado.mandado = obj(g0.mandado);
    Object.keys(obj(g0.audios)).forEach(function (k) {
      if (Array.isArray(g0.audios[k])) estado.audios[k] = g0.audios[k].filter(function (a) { return a && typeof a.archivo === "string"; });
    });
    estado.salida = obj(g0.salida);
    estado.sbHecho = obj(g0.sbHecho);
    estado.rechazadas = obj(g0.rechazadas);
    estado.clave = txt(g0.clave);
    estado.dispositivo = txt(g0.dispositivo);
  } catch (e) {}
  // La clave secreta viene en el enlace (…?clave=XXXX) y se recuerda en este teléfono. Solo letras sin acento,
  // números, - o _: lo que aceptan la base de datos y los nombres de los audios
  var CLAVE_OK = /^[A-Za-z0-9_-]{8,100}$/;
  var claveNueva = false;
  try { var claveUrl = (new URLSearchParams(location.search).get("clave") || "").trim(); if (CLAVE_OK.test(claveUrl) && claveUrl !== estado.clave) { estado.clave = claveUrl; claveNueva = true; } } catch (e) {}
  if (!CLAVE_OK.test(estado.clave)) estado.clave = "";
  if (!estado.dispositivo) {
    try { estado.dispositivo = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(8)), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
    catch (e) { estado.dispositivo = String(Math.random()).slice(2, 14); }
  }

  function guardarLocal() {
    if (!hayAlmacen) return;
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); }
    catch (e) { hayAlmacen = false; anunciar("Este teléfono ya no puede guardar sus respuestas. Mándelas por WhatsApp antes de cerrar."); }
  }
  function anunciar(t) { document.getElementById("anuncio").textContent = t; }

  function respuesta(id) {
    if (!estado.r[id]) estado.r[id] = limpiaR({});
    return estado.r[id];
  }
  function tocada(id) { var r = respuesta(id); r.act = new Date().toISOString(); return r; }
  function contestada(id) {
    var r = estado.r[id];
    return !!((estado.audios["m:" + id] || []).length || r && (r.es || r.suya || r.que_es.trim() || r.uso.length || r.sexo || r.significado.trim() ||
      (r.uso.indexOf(OTRA) >= 0 && r.uso_otro.trim())));
  }
  function cuantas() { return M.filter(function (m) { return contestada(m.id); }).length; }
  function textoGeneral(q) { var v = estado.g[q.id]; return v ? [v.opcion, v.texto.trim()].filter(Boolean).join(". ") : ""; }
  function generalesContestadas() { return G.filter(function (q) { return textoGeneral(q) || (estado.audios["g:" + q.id] || []).length; }).length; }

  function enLinea() { return modo === "db" || (sbActivo() && !sbFallo); }
  function dondeSeGuarda() {
    if (sbActivo() && !sbFallo) return textoSync();
    if (modo === "db") return "Lo que contesta se guarda en línea.";
    var fallo = sbActivo() ? "No pude guardar por internet. " : "";
    if (hayAlmacen) return fallo + (cuantas() + generalesContestadas()
      ? "Lo que contesta se queda guardado en este teléfono, pero todavía no me llega: cuando quiera, mándemelo con el botón «Mandar lo que llevo»."
      : "Lo que conteste se queda guardado en este teléfono. Cuando conteste algo, aquí sale el botón «Mandar lo que llevo» para mandármelo por WhatsApp.");
    return fallo + "Este teléfono no puede guardar lo que conteste. Mándemelo por WhatsApp antes de cerrar la página.";
  }

  // ---------- Supabase: cada respuesta se manda por internet en cuanto se puede ----------
  // estado.salida: lo que falta por mandar (sigue ahí si se cierra la página); estado.sbHecho: huella de lo
  // último que llegó de cada pregunta; estado.rechazadas: lo que la base no aceptó (eso va por WhatsApp)
  var sbFallo = false, sbEnviando = false, sbEspera = 0, sbTiempo = null, sbSinRed = false;
  function sbActivo() { return !!(SB && estado.clave); }
  function encabezados(extra) {
    var h = { apikey: SB.key };
    if (/^eyJ/.test(SB.key)) h.Authorization = "Bearer " + SB.key; // las claves anon viejas son JWT
    return Object.assign(h, extra || {});
  }
  function urlSB(ruta) { return SB.url.replace(/\/$/, "") + ruta; }
  function pendientesSalida() { return Object.keys(estado.salida).length; }
  function huella(o) {
    var s = JSON.stringify(o), h = 5381;
    for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0;
    return s.length + "." + (h >>> 0).toString(36);
  }
  function textoSync() {
    if (sbEnviando || pendientesSalida()) {
      if (!sbSinRed) return "Guardando…";
      return navigator.onLine === false ? "Sin internet por ahora: se guarda en cuanto haya conexión."
        : "Todavía no se guarda; lo vuelvo a intentar en un momento. Lo que contesta no se pierde.";
    }
    var sinSubir = audiosPendientes.filter(function (x) { return !x.definitivo; });
    if (sinSubir.length) return sinSubir.some(function (x) { return x.subiendo; }) ? "Guardando el audio…"
      : "Todavía no se guarda un audio; lo vuelvo a intentar en un momento. No cierre la página.";
    if (faltaPorWhatsapp()) return "Casi todo me llegó, pero algo no se pudo guardar por internet: mándemelo con el botón «Mandar lo que no llegó».";
    return "✓ Guardado: ya me llegó todo lo que ha contestado.";

    var sa = app.querySelector(".opcional"), m = M[Number(estado.pos) - 1];

    var iu = app.querySelector(".intro-usted");
    if (iu) iu.outerHTML = introUsted();
    app.querySelectorAll(".grabadora").forEach(function (c) { refrescarGrabadora(c.dataset.ambito); });
  }

  function pantallaTodas() {
    var hechas = cuantas(), ultima = estado.ultima || 1;
    app.innerHTML = barra("Todas sus máscaras", null, '<button class="boton chico" type="button" data-ir="' + ultima + '">← Volver</button>') +
      '<main class="pantalla"><div class="ficha"><h1 tabindex="-1">Todas sus máscaras</h1>' +
      '<p class="ayuda">Lleva ' + hechas + ' de ' + TOTAL + ' contestadas. Toque una para verla.</p></div>' +
      '<div class="acciones"><button class="boton" type="button" data-ir="usted">Preguntas sobre usted</button>' +
      (hechas + generalesContestadas() ? '<button class="boton" type="button" data-ir="enviar">' + (enLinea() ? "Ver sus respuestas" : "Mandar lo que llevo") + '</button>' : "") + '</div>' +
      '<ul class="rejilla">' + M.map(function (m) {
        var ok = contestada(m.id);
        return '<li><button type="button" data-ir="' + m.n + '" class="' + (ok ? "contestada" : "") + (m.n === ultima ? " aqui" : "") + '" aria-label="Máscara ' + m.n + ': ' + esc(m.ver) + (ok ? ", contestada" : "") + '">' +
          '<img src="' + esc(m.fotos[0]) + '" alt="" loading="lazy"><span class="num">' + m.n + '</span>' + (ok ? '<span class="listo">✓</span>' : "") + '</button></li>';
      }).join("") + '</ul></main>';
    nav.hidden = true;
    var aqui = app.querySelector(".rejilla .aqui");
    if (aqui && estado.ultima) setTimeout(function () { aqui.scrollIntoView({ block: "center" }); }, 0);
  }

  function pantallaUsted() {
    app.innerHTML = barra("Preguntas sobre usted", null) +
      '<main class="pantalla"><div class="ficha"><h1 tabindex="-1">Unas preguntas sobre usted y su taller</h1>' + introUsted() + '</div>' +
      G.map(function (q, k) {
        var v = estado.g[q.id] || { opcion: "", texto: "" }, h = "g-" + q.id;
        var campo = q.corto
          ? '<input type="text" class="corto" inputmode="numeric" id="t-' + q.id + '" data-general="' + q.id + '" value="' + esc(v.texto) + '" autocomplete="off">'
          : '<textarea id="t-' + q.id + '" data-general="' + q.id + '" rows="2" placeholder="' + (q.opciones ? "Si quiere, explique aquí" : "Escriba aquí") + '">' + esc(v.texto) + '</textarea>';
        return '<section class="pregunta"><h2 id="' + h + '"><label for="t-' + q.id + '">' + (k + 1) + '. ' + esc(q.texto) + '</label></h2>' +
          (q.foto ? '<img class="foto-pregunta" src="' + esc(q.foto) + '" alt="' + esc(q.alt || "") + '">' : "") +
          (q.enlaces ? '<div class="acciones">' + q.enlaces.map(function (e) { return '<a class="boton chico" href="' + esc(e[1]) + '" target="_blank" rel="noopener">' + esc(e[0]) + '</a>'; }).join("") + '</div>' : "") +
          (q.opciones ? opciones("g:" + q.id, q.opciones.map(function (o) { return { v: o, t: o }; }), v.opcion, false, h) : "") +
          campo + cajaAudios("g:" + q.id, k + 1, q.texto) + '</section>';
      }).join("") + mandarLoQueLlevo("") + '</main>';
    nav.hidden = false;
    atras.textContent = "← Máscaras";
    adelante.textContent = enLinea() ? "Terminar →" : "Mandar →";
  }

  var mandarTodo = false;
  function pantallaEnviar() {
    var lista = bloques(), porInternet = sbActivo() && !sbFallo;
    var nuevos = lista.filter(function (b) { return estado.mandado[b.id] !== b.texto; });
    var yaMando = lista.length - nuevos.length;
    // por internet solo va por WhatsApp lo que la base no aceptó y, si no hay internet, lo que espera en la cola
    var enCola = porInternet && sbSinRed ? lista.filter(function (b) { return estado.salida[claveSalida(b.id)]; }) : [];
    var porWa = {};
    (porInternet ? noLlegaron().concat(enCola) : []).forEach(function (b) { porWa[b.id] = true; });
    var aMandar = porInternet ? lista.filter(function (b) { return porWa[b.id]; }) : mandarTodo || !yaMando ? lista : nuevos;
    var ps = partes(aMandar), todo = ps.map(function (p) { return p.texto; }).join("\n\n");
    var hechas = cuantas(), gen = generalesContestadas(), ultima = estado.ultima || 1;
    var miChat = "Escoja mi chat" + (A_QUIEN ? " (" + esc(A_QUIEN) + ")" : "") + ".";
    var pasos = '<ol class="pasos">' +
      '<li>Toque el botón «Mandar por WhatsApp».</li>' +
      '<li>Se abre WhatsApp con el mensaje ya escrito.' + (DESTINO ? "" : " " + miChat) + ' Toque la flecha para enviarlo.</li>' +
      (ps.length > 1 ? '<li>Regrese aquí y toque el botón de la parte siguiente.</li>' : "") + '</ol>';
    var botones = '<div class="partes">' + ps.map(function (p, k) {
      var ya = !!estado.enviadas[p.clave];
      var titulo = "Mandar por WhatsApp" + (ps.length > 1 ? " (parte " + (k + 1) + " de " + ps.length + ")" : "");
      return '<a class="boton principal ancho' + (ya ? " mandada" : "") + '" data-parte="' + k + '" href="' + esc(wa(p.texto)) + '" target="_blank" rel="noopener">' + (ya ? "✓ Ya la abrió · " : "") + titulo + '</a>';
    }).join("") + '</div>';
    var malos = audiosMalos(), sinSubir = audiosPendientes.filter(function (x) { return !x.definitivo; });
    var algoDeAudio = sinSubir.length || malos.length || Object.keys(estado.mandado).some(function (k) { return k.indexOf("audio:") === 0; });
    var avisoAudio = !sinSubir.length ? "" : '<p class="aviso">' + (sinSubir.some(function (x) { return x.subiendo; }) ? "Guardando un audio que grabó… no cierre la página."
      : "Todavía no se guarda un audio que grabó; lo vuelvo a intentar en un momento. No cierre la página.") + '</p>';
    var audiosHtml = malos.length ? '<p class="aviso">' + (malos.length === 1 ? "Este audio no se pudo guardar por internet. Mándemelo por WhatsApp:" : "Estos audios no se pudieron guardar por internet. Mándemelos por WhatsApp:") +
      (malos.every(compartible) ? "" : " Si el botón nada más abre WhatsApp, ahí mande el mensaje y deje apretado el micrófono para grabarlo otra vez.") + '</p>' +
      '<div class="partes">' + malos.map(function (a) {
        var d = datosAmbito(a.ambito) || {};
        return '<button class="boton principal ancho" type="button" data-compartir="' + esc(a.archivo) + '">' + (compartible(a) ? "Mandar por WhatsApp" : "Grabar otra vez en WhatsApp") + ' el audio de ' +
          (a.ambito.charAt(0) === "m" ? "la máscara " + d.numero : "la pregunta " + d.numero + " sobre usted") + '</button>';
      }).join("") + '</div>' : "";
    var cuerpo;
    if (!lista.length && !algoDeAudio) {
      cuerpo = '<p>Todavía no hay respuestas. Regrese a las máscaras para empezar.</p>';
    } else if (porInternet) {
      cuerpo = audiosHtml + avisoAudio + (aMandar.length
          ? '<p class="aviso">' + (enCola.length ? "Todavía no me llega todo: parece que no hay internet. Deje esta página abierta y me llega en cuanto haya internet, o mándeme lo que contestó por WhatsApp:"
              : "Casi todo me llegó por internet, pero esto no se pudo guardar. Mándemelo por WhatsApp:") + '</p>' + pasos + botones
          : malos.length || sinSubir.length ? ""
          : '<p class="aviso estado-guardado">' + esc(textoSync()) + '</p>' +
            (sbEnviando || pendientesSalida() ? "" : '<p>No tiene que mandar nada: cada respuesta me llega por internet en cuanto la contesta. ¡Muchas gracias!</p>')) +
        (lista.length ? '<h2>Así quedaron sus respuestas</h2><pre class="resumen" id="resumen">' + esc(lista.map(function (b) { return b.texto; }).join("\n\n")) + '</pre>' : "");
    } else if (!aMandar.length) {
      cuerpo = audiosHtml + (lista.length ? '<p class="aviso">Ya me mandó todo lo que ha contestado. ¡Muchas gracias!</p>' +
        '<div class="acciones"><button class="boton" type="button" id="todo-otra-vez">Mandar todo otra vez</button></div>' : "");
    } else {
      cuerpo = audiosHtml;
      cuerpo += '<p>' + (modo === "db" ? "Sus respuestas ya quedaron guardadas en línea. Si quiere, también puede mandármelas por WhatsApp."
          : sbActivo() && sbFallo ? "No pude guardar por internet. Para que sus respuestas me lleguen:" : "Para que sus respuestas me lleguen:") + '</p>' + pasos +
        (yaMando && !mandarTodo ? '<p class="nota">Solo va lo nuevo desde la última vez (' + aMandar.length + (aMandar.length === 1 ? " respuesta" : " respuestas") + ').</p>' : "") +
        botones +
        '<p class="nota">Si no se abre WhatsApp, toque «Copiar el texto» y péguelo en un mensaje.</p>' +
        '<div class="acciones"><button class="boton" type="button" id="copiar">Copiar el texto</button>' +
        (yaMando && !mandarTodo ? '<button class="boton" type="button" id="todo-otra-vez">Mandar todo otra vez</button>' : "") + '</div>' +
        '<h2>Así quedaron sus respuestas</h2><pre class="resumen" id="resumen">' + esc(todo) + '</pre>';
    }
    app.innerHTML = barra(enLinea() ? "Sus respuestas" : "Mandar respuestas", null) +
      '<main class="pantalla"><div class="ficha"><h1 tabindex="-1">' + (enLinea() ? "¡Muchas gracias, don Gorgonio!" : "Mandar sus respuestas") + '</h1>' +
      '<p class="ayuda">Contestó ' + hechas + ' de ' + TOTAL + ' máscaras y ' + gen + ' de ' + G.length + ' preguntas sobre usted.</p></div>' +
      cuerpo +
      '<p class="nota">Puede seguir contestando después. Lo que ya contestó no se borra.</p>' +
      '<div class="acciones"><button class="boton" type="button" data-ir="' + ultima + '">Volver a la máscara ' + ultima + '</button></div></main>';
    nav.hidden = true;
    app.querySelectorAll("a[data-parte]").forEach(function (a) {
      a.addEventListener("click", function () {
        var p = ps[Number(a.dataset.parte)];
        estado.enviadas[p.clave] = true;
        p.bloques.forEach(function (b) { if (!b.parcial) estado.mandado[b.id] = b.fin || b.texto; });
        guardarLocal();
        a.classList.add("mandada");
        a.textContent = "✓ Ya la abrió · " + a.textContent.replace(/^✓ Ya la abrió · /, "");
      });
    });
    var otraVez = document.getElementById("todo-otra-vez");
    if (otraVez) otraVez.addEventListener("click", function () { mandarTodo = true; render(true); });
    var copiar = document.getElementById("copiar");
    if (copiar) copiar.addEventListener("click", function () {
      var hecho = function () { copiar.textContent = "Copiado"; anunciar("Texto copiado"); setTimeout(function () { copiar.textContent = "Copiar el texto"; }, 2500); };
      var seleccionar = function () {
        var pre = document.getElementById("resumen"), sel = window.getSelection(), rango = document.createRange();
        rango.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(rango);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        if (ok) { hecho(); return; }
        copiar.textContent = "Deje el dedo sobre el texto de abajo y toque «Copiar»";
        setTimeout(function () { copiar.textContent = "Copiar el texto"; }, 6000);
      };
      try { navigator.clipboard.writeText(todo).then(hecho, seleccionar); } catch (e) { seleccionar(); }
    });
  }

  function pantallaInicio() {
    var hechas = cuantas() + generalesContestadas();
    var seguir = estado.ultima ? Math.min(estado.ultima, TOTAL) : 1;
    app.innerHTML = '<main class="pantalla inicio">' +
      '<h1 tabindex="-1">Don Gorgonio: cuénteme de sus máscaras</h1>' +
      '<p class="saludo">' + (D.firma ? "Soy " + esc(D.firma) + ". " : "") + 'Estoy haciendo la página de internet de su trabajo y quiero ponerle bien el nombre a cada máscara.</p>' +
      '<p>Le voy a enseñar sus máscaras una por una. De cada una le pregunto tres cosas:</p>' +
      '<ol class="pasos"><li>Qué es</li><li>En qué danza o fiesta se usa</li><li>Qué significa</li></ol>' +
      '<p>Conteste las que pueda. No tiene que contestar todas ni hacerlo en un solo día; si no sabe alguna, toque «Siguiente».</p>' +
      (sbActivo() && !sbFallo
        ? '<p class="aviso">Cada respuesta me llega por internet en cuanto la contesta; no tiene que mandar nada. Puede contestar poco a poco y seguir otro día con este mismo enlace. Si lo abre en otro teléfono, ahí no verá lo que ya contestó, pero a mí ya me llegó.' + (puedeGrabar() ? " Si prefiere hablar en vez de escribir, en cada máscara puede grabarme un audio; no es obligatorio." : "") + '</p>'
        : modo === "db" ? "" : hayAlmacen
        ? '<p class="aviso">Lo que conteste se queda guardado en este teléfono, pero no me llega hasta que me lo mande: cuando quiera, toque el botón «Mandar lo que llevo» y me llega por WhatsApp. Para seguir otro día, abra otra vez el enlace en este mismo teléfono.</p>'
        : '<p class="aviso">Este teléfono no puede guardar lo que conteste. Antes de cerrar la página, toque el botón «Mandar lo que llevo» para que me llegue por WhatsApp.</p>') +
      '<div class="acciones">' + (hechas
        ? '<button class="boton principal" type="button" data-ir="' + seguir + '">Seguir en la máscara ' + seguir + '</button>' +
          (enLinea() ? "" : '<button class="boton" type="button" data-ir="enviar">Mandar lo que llevo</button>') + '<button class="boton" type="button" data-ir="todas">Ver todas</button>'
        : '<button class="boton principal" type="button" data-ir="1">Empezar</button>') + '</div>' +
      '<p class="nota">' + (hechas ? "Lleva " + cuantas() + " de " + TOTAL + " máscaras contestadas." : "Son las " + TOTAL + " máscaras de las que tengo foto. Al final hay unas preguntas sobre usted y su taller.") + '</p></main>';
    nav.hidden = true;
  }

  function render(moverFoco) {
    var p = estado.pos, n = Number(p);
    if (p === "todas") pantallaTodas();
    else if (p === "usted") pantallaUsted();
    else if (p === "enviar") pantallaEnviar();
    else if (/^\d+$/.test(p) && n >= 1 && n <= TOTAL) pantallaMascara(n);
    else { estado.pos = "inicio"; pantallaInicio(); }
    if (moverFoco) {
      if (p !== "todas") window.scrollTo(0, 0);
      var h = app.querySelector("h1");
      if (h) h.focus({ preventScroll: true });
    }
  }

  // ---------- Eventos ----------
  function marcarGrupo(b, valor) {
    b.parentNode.querySelectorAll(".opcion").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.valor === valor)); });
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button, a");
    if (!b || !app.contains(b)) return;
    if (b.dataset.ir) { ir(b.dataset.ir); return; }
    var n = Number(estado.pos), m = M[n - 1];
    if (b.dataset.vista != null && m) {
      document.getElementById("foto").src = m.fotos[Number(b.dataset.vista)];
      app.querySelectorAll("[data-vista]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      return;
    }
    if (b.dataset.sugerencia && m) {
      var r0 = tocada(m.id), campo = document.getElementById("que-es");
      r0.que_es = r0.que_es === b.dataset.sugerencia ? "" : b.dataset.sugerencia;
      campo.value = r0.que_es;
      app.querySelectorAll("[data-sugerencia]").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.sugerencia === r0.que_es)); });
      guardarLocal(); subirMascara(m.id); encolarMascara(m.id);
      return;
    }
    if (b.hasAttribute("data-grabar")) {
      var caja = b.closest(".grabadora");
      if (!grabando) empezarGrabacion(caja);
      else if (grabando.ambito === caja.dataset.ambito) {
        // mientras pide el permiso, o justo al empezar (doble toque), el toque no cuenta
        if (grabando.rec && Date.now() - grabando.inicio > 800) pararGrabacion();
      } else if (grabando.rec) {
        pararGrabacion();
        avisoGrabadora(caja, "Guardé el audio que estaba grabando en otra pregunta. Para grabar aquí, toque otra vez «Grabar un audio».");
      }
      return;
    }
    if (b.hasAttribute("data-reintentar")) { subirPendientes(); return; }
    if (b.dataset.compartir) {
      var au = audiosPendientes.filter(function (x) { return x.archivo === b.dataset.compartir; })[0];
      if (au) compartirAudio(au);
      return;
    }
    if (!b.dataset.campo) return;
    var c = b.dataset.campo, v = b.dataset.valor;
    if (c.indexOf("g:") === 0) {
      var id = c.slice(2), g = estado.g[id] = Object.assign({ opcion: "", texto: "" }, estado.g[id]);
      g.opcion = g.opcion === v ? "" : v;
      estado.gAct = new Date().toISOString();
      marcarGrupo(b, g.opcion);
      guardarLocal(); subirGenerales(); encolarGeneral(id);
      return;
    }
    if (!m) return;
    var r = tocada(m.id);
    if (b.dataset.multiple) {
      var i = r.uso.indexOf(v);
      if (i >= 0) {
        r.uso.splice(i, 1);
        if (v === OTRA) { r.uso_otro = ""; document.getElementById("uso-otro").value = ""; }
      } else if (v === NO_SE || v === ADORNO) {
        r.uso = [v]; r.uso_otro = ""; document.getElementById("uso-otro").value = "";
      } else {
        r.uso = r.uso.filter(function (u) { return u !== NO_SE && u !== ADORNO; });
        r.uso.push(v);
      }
      b.parentNode.querySelectorAll(".opcion").forEach(function (o) { o.setAttribute("aria-pressed", String(r.uso.indexOf(o.dataset.valor) >= 0)); });
      document.getElementById("uso-otro-caja").hidden = r.uso.indexOf(OTRA) < 0;
      // macho o hembra solo se pregunta para la Danza de los Morenos
      var conDanza = r.uso.indexOf(DANZA) >= 0, cajaSexo = document.getElementById("sexo-caja");
      cajaSexo.hidden = !conDanza;
      if (!conDanza && r.sexo) { r.sexo = ""; cajaSexo.querySelectorAll(".opcion").forEach(function (o) { o.setAttribute("aria-pressed", "false"); }); }
    } else {
      r[c] = r[c] === v ? "" : v;
      marcarGrupo(b, r[c]);
      if (c === "es") document.getElementById("otra").hidden = r.es !== "otra";
    }
    guardarLocal(); subirMascara(m.id); encolarMascara(m.id);
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.general) {
      var g = estado.g[t.dataset.general] = Object.assign({ opcion: "", texto: "" }, estado.g[t.dataset.general]);
      g.texto = t.value;
      estado.gAct = new Date().toISOString();
      guardarLocal(); subirGenerales(); encolarGeneral(t.dataset.general);
      return;
    }
    if (t.dataset.texto) {
      var m = M[Number(estado.pos) - 1];
      if (!m) return;
      var r = tocada(m.id);
      r[t.dataset.texto] = t.value;
      if (t.dataset.texto === "que_es") app.querySelectorAll("[data-sugerencia]").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.sugerencia === t.value)); });
      guardarLocal(); subirMascara(m.id); encolarMascara(m.id);
    }
  });
  atras.addEventListener("click", function () {
    var p = estado.pos, n = Number(p);
    if (p === "usted") ir(TOTAL); else if (n > 1) ir(n - 1); else ir("inicio");
  });
  adelante.addEventListener("click", function () {
    var p = estado.pos, n = Number(p);
    if (p === "usted") ir("enviar"); else if (n >= TOTAL) ir("usted"); else ir(n + 1);
  });
  document.addEventListener("focusin", function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) document.body.classList.add("escribiendo");
  });
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (!editando()) document.body.classList.remove("escribiendo"); }, 0);
  });
  window.addEventListener("popstate", function (e) {
    var p = e.state && e.state.pos;
    if (!p) return;
    ir(p, true);
  });

  try { history.replaceState({ pos: estado.pos }, ""); } catch (e) {}
  if (claveNueva) guardarLocal();
  ponerAlDia();
  render(false);
  conectar();
  enviarSalida();
})();
</script>
