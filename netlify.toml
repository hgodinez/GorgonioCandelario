# Netlify publica solo lo que usa el sitio. La investigación, las herramientas, los datos,
# las fotos originales y el README se quedan en el repositorio y no salen en el dominio.
[build]
  command = "rm -rf _sitio && mkdir _sitio && cp -R index.html galeria.html 404.html css js img fuentes preguntas _sitio/"
  publish = "_sitio"

# La encuesta no debe salir en los buscadores (la página también lo pide con su meta robots)
[[headers]]
  for = "/preguntas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Las fuentes no cambian: el navegador las guarda un año sin volver a preguntar. Si alguna se cambia, hay que darle
# otro nombre al archivo (y cambiarlo en los @font-face y los preload), o los visitantes seguirán con la vieja.
# Las fotos se quedan con lo que Netlify hace por omisión mientras se sigan reemplazando con el mismo nombre.
[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
